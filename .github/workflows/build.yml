# .github/workflows/build.yml : tests, then the Windows and both Mac builds side by side.
# Every push to main gives downloadable test builds (Actions > this run > Artifacts).
# A tag like v0.3.0 also makes a GitHub release with all three files attached.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      lite:
        description: "Lite builds (no CLAP / torch)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.{0}', github.run_number) }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-app.txt pytest
      - run: python -m pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: dist/.cache
          key: win-${{ hashFiles('requirements*.txt') }}
      - name: Build
        shell: pwsh
        run: |
          $buildArgs = @{ Version = $env:VERSION.TrimStart("v") }
          if ("${{ inputs.lite }}" -eq "true") { $buildArgs.Lite = $true }
          ./packaging/build_portable.ps1 @buildArgs
      - uses: actions/upload-artifact@v4
        with:
          name: subjetunes-windows
          path: dist/Subjetunes-*-win64.zip
          retention-days: 14

  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }          # Apple silicon
          - { runner: macos-15-intel, arch: x86_64 }   # Intel (GitHub's last Intel image, until 2027); always lite
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: dist/.cache
          key: mac-${{ matrix.arch }}-${{ hashFiles('requirements*.txt') }}
      # Optional: real signing + notarisation. Add these repository secrets to enable it:
      #   MACOS_CERT_P12 (base64 Developer ID Application .p12), MACOS_CERT_PASSWORD,
      #   MACOS_SIGN_IDENTITY ("Developer ID Application: Name (TEAMID)"),
      #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password)
      - name: Signing keychain
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
          xcrun notarytool store-credentials subjetunes --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}"
          echo "SIGN_IDENTITY=${{ secrets.MACOS_SIGN_IDENTITY }}" >> "$GITHUB_ENV"
          echo "NOTARY_PROFILE=subjetunes" >> "$GITHUB_ENV"
        shell: bash
      - name: Build
        run: |
          export VERSION="${VERSION#v}"
          extra=""; [ "${{ inputs.lite }}" = "true" ] && extra="--lite"
          bash packaging/macos/build_macos.sh --arch ${{ matrix.arch }} --dmg $extra
      - uses: actions/upload-artifact@v4
        with:
          name: subjetunes-macos-${{ matrix.arch }}
          path: |
            dist/Subjetunes-*-macos-*.zip
            dist/Subjetunes-*-macos-*.dmg
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${{ github.ref_name }}" out/* --repo "${{ github.repository }}" --generate-notes --prerelease
